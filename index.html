<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PacificBox - Double B</title>
  <link rel="icon" type="image/png" href="PacificBox.png">
  <link rel="apple-touch-icon" href="PacificBox.png">
  <link rel="manifest" href="manifest.json">
  <!-- FIX: Corrected CDN engine link -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Open scrolling layout for all devices - no more locked vaults */
    html, body {
      background-color: #09090b;
      color: #fafafa;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-y: auto !important; /* Forces scroll bar to always work */
    }
  </style>
</head>
<body class="antialiased select-none">

  <!-- Main Open Content Wrapper -->
  <div class="w-full max-w-4xl mx-auto p-4 md:p-8 flex flex-col gap-6">
    
    <!-- Top Branding Header -->
    <header class="flex justify-between items-center border-b border-zinc-800 pb-4">
      <div>
        <h1 class="font-bold text-2xl text-amber-500 tracking-wide uppercase">DOUBLE B</h1>
        <p class="text-xs text-zinc-400 font-medium">Loyalty, Land & Freedom</p>
      </div>
      <span class="bg-amber-600/20 text-amber-400 text-xs px-3 py-1.5 rounded-full font-bold border border-amber-500/30 uppercase tracking-widest">
        Cinema Stream
      </span>
    </header>

    <!-- Widescreen Video Theater Box -->
    <div class="w-full bg-black rounded-xl overflow-hidden shadow-2xl border border-zinc-800/50 aspect-video flex items-center justify-center">
      <video 
        id="main-player" 
        class="w-full h-full object-contain"
        controls
        preload="auto"
        playsinline
        webkit-playsinline
        src="episode1.mp4">
      </video>
    </div>

    <!-- Premium Dashboard & Controls Section -->
    <main class="bg-zinc-900/50 border border-zinc-800/50 rounded-xl p-6 flex flex-col gap-4">
      <div>
        <h2 id="episode-title" class="font-bold text-lg text-zinc-100">Episode 1: Double B Station</h2>
        <p class="text-sm text-zinc-400">PasificBox Production</p>
      </div>
      
      <div class="flex flex-col gap-2">
        <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-wider">Select Episode</h3>
        <!-- Clean Horizontal Scrolling Playlist Buttons -->
        <div class="flex gap-3 overflow-x-auto pb-2">
          <button onclick="changeVideo('Episode 1: Double B Station', 'episode1.mp4')" class="bg-amber-600 hover:bg-amber-700 text-black px-5 py-2.5 rounded-lg shrink-0 text-xs font-bold transition duration-200 shadow-md">Ep 1</button>
          <button onclick="changeVideo('Episode 2: The Confrontation', 'episode2.mp4')" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-5 py-2.5 rounded-lg shrink-0 text-xs font-bold transition duration-200">Ep 2</button>
          <button onclick="changeVideo('Episode 3: The Threat Intensifies', 'episode3.mp4')" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-5 py-2.5 rounded-lg shrink-0 text-xs font-bold transition duration-200">Ep 3</button>
        </div>
      </div>
    </main>

  </div>

    <script>
    // 1. ADD THIS NEW CODE: Registers the Service Worker so the browser lets you install the app
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered successfully:', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    // 2. KEEP YOUR EXISTING CODE: This runs your episode switching
    function changeVideo(title, videoUrl) {
      document.getElementById('episode-title').innerText = title;
      const player = document.getElementById('main-player');
      player.src = videoUrl;
      player.preload = "auto";
      player.load();
      player.play().catch(error => { console.log(error); });
    }
  </script>

</body>
</html>
