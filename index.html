<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PacificBox - Cinematic Stream Network</title>
  
  <!-- Rock-Solid Tailwind CSS Engine Delivery Link -->
  <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-950 text-gray-50 min-h-screen p-6 select-none" style="background-color: #0b0f19;">

  <!-- HEADER SECTION -->
  <header class="max-w-6xl mx-auto flex justify-between items-center border-b border-gray-900 pb-6 mb-8">
    <div class="flex items-center gap-3">
      <!-- Your Local Logo File -->
      <img src="PacificBox.png" alt="PacificBox Logo" class="w-12 h-12 object-contain">
      <div>
        <h1 class="font-bold text-xl tracking-wider text-white">PACIFICBOX</h1>
        <p class="text-xs text-gray-500 uppercase tracking-widest">Cinematic Stream Network</p>
      </div>
    </div>
  </header>

  <!-- MAIN CATALOG CONTENT -->
  <main class="max-w-6xl mx-auto flex flex-col gap-10">

    <!-- HISTORICAL THRILLER GENRE SECTION -->
    <section class="mb-10">
      <h2 class="text-xs font-bold text-yellow-600 uppercase tracking-widest mb-4">Historical Thriller</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
        
        <!-- Double B Show Card Button -->
        <div onclick="openVideoPlayer()" class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden cursor-pointer transform hover:scale-105 transition duration-300 shadow-xl group">
          <div class="w-full bg-black" style="aspect-ratio: 16/9;">
            <!-- Your Local Poster Image File -->
            <img src="doubleb-poster.png" alt="Double B Poster" class="w-full h-full object-cover">
          </div>
          <div class="p-4">
            <h3 class="font-bold text-sm text-gray-200 group-hover:text-yellow-500 transition">Double B</h3>
            <p class="text-xs text-gray-500 mt-1">Loyalty, Land & Freedom</p>
          </div>
        </div>

        <!-- Project Orion Placeholder -->
        <div class="bg-gray-900/50 border border-gray-800 rounded-xl flex items-center justify-center p-8 border-dashed" style="aspect-ratio: 16/11;">
          <span class="text-xs font-bold text-gray-700 tracking-widest uppercase">Project Orion</span>
        </div>

      </div>
    </section>

    <!-- LEGAL DRAMA GENRE SECTION -->
    <section>
      <h2 class="text-xs font-bold text-yellow-600 uppercase tracking-widest mb-4">Legal Drama</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
        <div class="bg-gray-900/50 border border-gray-800 rounded-xl flex items-center justify-center p-8 border-dashed" style="aspect-ratio: 16/11;">
          <span class="text-xs font-bold text-gray-700 tracking-widest uppercase">Coming Soon</span>
        </div>
      </div>
    </section>

  </main>

  <!-- OVERLAY CINEMATIC VIDEO PLAYER DIALOG CONTAINER -->
  <div id="videoModal" class="hidden fixed inset-0 bg-black bg-opacity-95 z-50 flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl flex flex-col gap-4">
      <div class="flex justify-between items-center w-full mb-2">
        <h2 class="font-bold text-lg text-yellow-500 uppercase tracking-wide">Double B - Pilot</h2>
        <button onclick="closeVideoPlayer()" class="bg-gray-900 hover:bg-gray-800 text-gray-400 hover:text-white text-xs px-4 py-2 rounded-full font-bold transition uppercase tracking-wider">
          ✕ Close Player
        </button>
      </div>
      <div class="w-full bg-black rounded-xl overflow-hidden border border-gray-800 shadow-2xl" style="aspect-ratio: 16/9;">
        <!-- Local Video Stream Source -->
        <video id="main-player" class="w-full h-full object-contain" controls preload="auto" src=""></video>
      </div>
    </div>
  </div>

  <!-- CORE APP INTERACTION CONTROL SCRIPTS -->
  <script>
    function openVideoPlayer() {
      const modal = document.getElementById('videoModal');
      const player = document.getElementById('main-player');
      modal.classList.remove('hidden');
      modal.style.display = 'flex';
      player.src = "episode1.mp4"; 
      player.load();
      player.play().catch(err => console.log("Playback interaction handled:", err));
    }

    function closeVideoPlayer() {
      const modal = document.getElementById('videoModal');
      const player = document.getElementById('main-player');
      player.pause();
      player.src = "";
      modal.classList.add('hidden');
      modal.style.display = 'none';
    }
  </script>

</body>
</html>
