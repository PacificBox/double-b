<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PacificBox - Double B</title>
  <link rel="icon" type="image/png" href="PacificBox.png">
  <link rel="apple-touch-icon" href="PacificBox.png">
  <link rel="manifest" href="manifest.json">
  <!-- FIX: Corrected CDN engine link -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Open scrolling layout for all devices - no more locked vaults */
    html, body {
      background-color: #09090b;
      color: #fafafa;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-y: auto !important; /* Forces scroll bar to always work */
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-50 font-sans antialiased min-h-screen overflow-y-auto select-none">

  <!-- ======================================================== -->
  <!-- LEVEL 0: THE PACIFICBOX MAIN LANDING POSTER               -->
  <!-- ======================================================== -->
  <div id="landingPosterPage" class="w-full min-h-screen bg-zinc-950 flex justify-center items-center relative overflow-hidden select-none">
    
    <!-- Your One-Piece Master Artwork Graphic -->
    <img src="landing-poster.png" alt="PacificBox Hub Poster" class="w-full h-full min-h-screen object-cover absolute inset-0 z-10">

    <!-- Invisible Active Hotspot (Sits directly on top of your artwork's CATALOG button) -->
    <div class="absolute top-[2%] right-[2%] z-20 w-[15%] h-[8%] md:w-[12%] md:h-[6%] cursor-pointer bg-transparent" onclick="enterTheVault()" title="Enter The Vault"></div>

  </div>
  <div id="catalogPage" class="hidden w-full max-w-4xl mx-auto p-4 md:p-8 flex flex-col gap-6">
    <!-- Main Branding Header -->
    <header class="flex justify-between items-center border-b border-zinc-800 pb-4">
      <div class="flex items-center gap-3">
        <img src="PacificBox.png" alt="PacificBox Logo" class="w-10 h-10 rounded-lg shadow-lg">
        <div>
          <h1 class="font-bold text-xl text-zinc-100 tracking-wide uppercase">PacificBox</h1>
          <p class="text-xs text-zinc-400 font-medium">Cinematic Stream Network</p>
        </div>
      </div>
      <span class="bg-zinc-800 text-zinc-400 text-xs px-3 py-1.5 rounded-full font-bold border border-zinc-700/50 uppercase tracking-widest">
        Catalog
      </span>
    </header>

    <!-- Series Grid Layout -->
    <!-- ======================================================== -->
    <!-- THE VAULT: NETFLIX-STYLE HORIZONTAL GENRE ROWS            -->
    <!-- ======================================================== -->
    <div class="flex flex-col gap-8 mt-4">
      
      <!-- ROW 1: SCI-FI -->
      <div class="flex flex-col gap-3">
        <h2 class="text-sm font-bold text-amber-500 uppercase tracking-wider">Sci-Fi</h2>
        <div class="flex gap-4 overflow-x-auto pb-3 snap-x scrollbar-thin">
          
          <!-- Double B Card (Clicks straight into your player view!) -->
          <div onclick="openSeries()" class="min-w-[260px] max-w-[260px] bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden cursor-pointer hover:border-amber-500/50 transition duration-300 snap-start group">
            <div class="aspect-video w-full bg-zinc-800 relative">
              <img src="doubleb-poster.png" alt="Double B" class="w-full h-full object-cover">
            </div>
            <div class="p-3">
              <h3 class="font-bold text-sm text-white group-hover:text-amber-500 transition-colors">Double B</h3>
              <p class="text-[11px] text-zinc-400 mt-1 line-clamp-1">Loyalty, Land & Freedom</p>
            </div>
          </div>

          <!-- Future Project Placeholder -->
          <div class="min-w-[260px] max-w-[260px] bg-zinc-900/40 border border-dashed border-zinc-800 rounded-xl p-4 flex flex-col justify-center items-center text-center opacity-40 snap-start">
            <span class="text-zinc-500 text-sm font-bold">+</span>
            <p class="text-zinc-400 text-xs font-bold mt-1 uppercase tracking-wide">Project Orion</p>
          </div>

        </div>
      </div>

      <!-- ROW 2: COURTROOM DRAMA -->
      <div class="flex flex-col gap-3">
        <h2 class="text-sm font-bold text-amber-500 uppercase tracking-wider">Courtroom Drama</h2>
        <div class="flex gap-4 overflow-x-auto pb-3 snap-x">
          <div class="min-w-[260px] max-w-[260px] bg-zinc-900/40 border border-dashed border-zinc-800 rounded-xl p-8 flex flex-col justify-center items-center text-center opacity-30 snap-start">
            <p class="text-zinc-500 text-xs font-bold uppercase tracking-wider">Coming Soon</p>
          </div>
        </div>
      </div>

    </div>

      <!-- SERIES CARD 2: COMING SOON HOOK -->
      <div class="opacity-30 bg-zinc-900/10 border border-dashed border-zinc-800 rounded-xl p-6 flex flex-col justify-center items-center text-center min-h-[300px]">
        <div class="w-10 h-10 rounded-full border border-zinc-800 flex items-center justify-center mb-3 text-zinc-500 text-lg font-bold">+</div>
        <h3 class="text-base font-bold text-zinc-400 uppercase tracking-wider">Next Project</h3>
        <p class="text-zinc-500 text-xs mt-1">A brand new unique story is currently in development.</p>
      </div>

    </div>
  </div>


  <!-- ======================================================== -->
  <!-- LEVEL 2 & 3: THE DOUBLE B STREAMING PLAYER DASHBOARD     -->
  <!-- ======================================================== -->
   <div id="seriesPage" class="hidden w-full max-w-4xl mx-auto p-4 md:p-8 flex flex-col gap-6">
    
    <!-- Header with a clean navigation link back to the catalog main hub -->
    <header class="flex justify-between items-center border-b border-zinc-800 pb-4">
      <div>
        <h1 class="font-bold text-2xl text-amber-500 tracking-wide uppercase">DOUBLE B</h1>
        <p class="text-xs text-zinc-400 font-medium">Loyalty, Land & Freedom</p>
      </div>
      <button onclick="goHome()" class="bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white text-xs px-3 py-1.5 rounded-full font-bold border border-zinc-800 transition duration-200 uppercase tracking-wider flex items-center gap-1">
        ← Exit to Catalog
      </button>
    </header>

      <!-- Widescreen Video / Poster Presentation Frame -->
    <div id="mediaBox" class="w-full bg-black rounded-xl overflow-hidden shadow-2xl border border-zinc-800/50 aspect-video relative flex items-center justify-center">
      
      <!-- LEVEL 2: Static Poster Thumbnail state -->
      <div id="posterScreen" class="absolute inset-0 z-10 w-full h-full cursor-pointer" onclick="startWithFirstEpisode()">
        <img src="doubleb-poster.png" alt="Double B Poster Art" class="w-full h-full object-cover">
      </div>

      <!-- LEVEL 3: Core video streaming element -->
      <video 
        id="main-player" 
        class="w-full h-full object-contain"
        controls
        preload="auto"
        playsinline
        webkit-playsinline
        src="">
      </video>
    </div>

    <!-- Premium Dashboard Selection Grid Section -->
    <main class="bg-zinc-900/50 border border-zinc-800/50 rounded-xl p-6 flex flex-col gap-4">
      <div>
        <h2 id="episode-title" class="font-bold text-lg text-zinc-100">Ready to Stream</h2>
        <p class="text-sm text-zinc-400">PacificBox Production</p>
      </div>
      
      <div class="flex flex-col gap-2">
        <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-wider">Select Episode</h3>
        <!-- Horizontal scrolling stream selections -->
        <div class="flex gap-3 overflow-x-auto pb-2">
          <button id="btn-ep1" onclick="changeVideo('Pilot: Double B Station', 'episode1.mp4', this)" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-5 py-2.5 rounded-lg shrink-0 text-xs font-bold transition duration-200">Pilot</button>
          <button id="btn-ep2" onclick="changeVideo('Episode 2: The Confrontation', 'episode2.mp4', this)" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-5 py-2.5 rounded-lg shrink-0 text-xs font-bold transition duration-200">Episode 2</button>
          <button id="btn-ep3" onclick="changeVideo('Episode 3: The Threat Intensifies', 'episode3.mp4', this)" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-5 py-2.5 rounded-lg shrink-0 text-xs font-bold transition duration-200">Episode 3</button>
        </div>
      </div>
    </main>

  </div>

  <!-- ======================================================== -->
  <!-- CONTROL LOGIC RUNNERS                                    -->
  <!-- ======================================================== -->
  <script>
    // Service Worker Activation 
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered successfully:', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    // Navigation: Enter Double B view
    function openSeries() {
      document.getElementById('catalogPage').classList.add('hidden');
      document.getElementById('seriesPage').classList.remove('hidden');
      resetToPosterState();
    }

    // Navigation: Return to Main Hub Entrance
        // Navigation: Transition from 5-Column Poster into the Vault Rows
    function enterTheVault() {
      document.getElementById('landingPosterPage').classList.add('hidden');
      document.getElementById('catalogPage').classList.remove('hidden');
    }

    // Navigation: Return all the way out to the Main Landing Poster
    function goHome() {
      const player = document.getElementById('main-player');
      player.pause();
      document.getElementById('seriesPage').classList.add('hidden');
      document.getElementById('catalogPage').classList.add('hidden');
      document.getElementById('landingPosterPage').classList.remove('hidden');
    }

    // Helper: Reset view back to the custom menu poster screen
    function resetToPosterState() {
      document.getElementById('posterScreen').classList.remove('hidden');
      document.getElementById('episode-title').innerText = "Ready to Stream";
      
      // Clear all active selection styles from buttons
      resetButtonStyles();
    }

    // Quick helper to strip amber highlight style from buttons
    function resetButtonStyles() {
      const buttons = [document.getElementById('btn-ep1'), document.getElementById('btn-ep2'), document.getElementById('btn-ep3')];
      buttons.forEach(btn => {
        if(btn) {
          btn.className = "bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-5 py-2.5 rounded-lg shrink-0 text-xs font-bold transition duration-200";
        }
      });
    }

    // Automatically click first choice if someone taps on the poster image banner directly
    function startWithFirstEpisode() {
      const ep1Btn = document.getElementById('btn-ep1');
      changeVideo('Pilot: Double B Station', 'episode1.mp4', ep1Btn);
    }

    // Unified Episode Trigger Control
    function changeVideo(title, videoUrl, element) {
      // 1. Hide the visual thumbnail poster cover to unveil the player element underneath
      document.getElementById('posterScreen').classList.add('hidden');
      
      // 2. Adjust titles and direct source targets
      document.getElementById('episode-title').innerText = title;
      const player = document.getElementById('main-player');
      player.src = videoUrl;
      player.preload = "auto";
      player.load();
      
      // 3. Reset styling highlights and add the glowing Amber look onto the chosen button
      resetButtonStyles();
      if(element) {
        element.className = "bg-amber-600 hover:bg-amber-700 text-black px-5 py-2.5 rounded-lg shrink-0 text-xs font-bold transition duration-200 shadow-md";
      }

      // 4. Play tracking stream
      player.play().catch(error => { console.log(error); });
    }
  </script>

</body>
</html>
