<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PacificBox - Cinematic Stream Network</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-50 font-sans antialiased min-h-screen p-6 select-none">

  <!-- HEADER SECTION -->
  <header class="max-w-6xl mx-auto flex justify-between items-center border-b border-zinc-900 pb-6 mb-8">
    <div class="flex items-center gap-3">
      <!-- Cloudflare Logo Image Link -->
      <img src="https://r2.dev" alt="PacificBox Logo" class="w-10 h-10">
      <div>
        <h1 class="font-bold text-xl tracking-wider text-white">PACIFICBOX</h1>
        <p class="text-[10px] text-zinc-500 uppercase tracking-widest">Cinematic Stream Network</p>
      </div>
    </div>
  </header>

  <!-- MAIN CATALOG CONTENT -->
  <main class="max-w-6xl mx-auto flex flex-col gap-10">

    <!-- HISTORICAL THRILLER GENRE SECTION -->
    <section>
      <h2 class="text-xs font-bold text-amber-600 uppercase tracking-widest mb-4">Historical Thriller</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
        
        <!-- Double B Show Card Button -->
        <div onclick="openVideoPlayer()" class="bg-zinc-900/40 border border-zinc-900 rounded-xl overflow-hidden cursor-pointer hover:scale-105 transition duration-300 shadow-xl group">
          <div class="aspect-[16/9] w-full bg-zinc-950">
            <!-- Cloudflare Poster Artwork Link -->
            <img src="https://r2.dev" alt="Double B Poster" class="w-full h-full object-cover">
          </div>
          <div class="p-4">
            <h3 class="font-bold text-sm text-zinc-200 group-hover:text-amber-500 transition">Double B</h3>
            <p class="text-[11px] text-zinc-500 mt-0.5">Loyalty, Land & Freedom</p>
          </div>
        </div>

        <!-- Project Orion Placeholder -->
        <div class="bg-zinc-900/10 border border-zinc-900/50 rounded-xl aspect-[16/11] flex items-center justify-center border-dashed">
          <span class="text-xs font-bold text-zinc-700 tracking-widest uppercase">Project Orion</span>
        </div>

      </div>
    </section>

    <!-- LEGAL DRAMA GENRE SECTION -->
    <section>
      <h2 class="text-xs font-bold text-amber-600 uppercase tracking-widest mb-4">Legal Drama</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
        <div class="bg-zinc-900/10 border border-zinc-900/50 rounded-xl aspect-[16/11] flex items-center justify-center border-dashed">
          <span class="text-xs font-bold text-zinc-700 tracking-widest uppercase">Coming Soon</span>
        </div>
      </div>
    </section>

  </main>

  <!-- OVERLAY CINEMATIC VIDEO PLAYER DIALOG CONTAINER -->
  <div id="videoModal" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl flex flex-col gap-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-lg text-amber-500 uppercase tracking-wide">Double B - Pilot</h2>
        <button onclick="closeVideoPlayer()" class="bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white text-xs px-4 py-2 rounded-full font-bold transition uppercase tracking-wider">
          ✕ Close Player
        </button>
      </div>
      <div class="w-full aspect-video bg-black rounded-xl overflow-hidden border border-zinc-800 shadow-2xl">
        <!-- Cloudflare Video Stream Link -->
        <video id="main-player" class="w-full h-full object-contain" controls preload="auto" src=""></video>
      </div>
    </div>
  </div>

  <!-- CORE APP INTERACTION CONTROL SCRIPTS -->
  <script>
    function openVideoPlayer() {
      const modal = document.getElementById('videoModal');
      const player = document.getElementById('main-player');
      modal.classList.remove('hidden');
      player.src = "https://r2.dev";
      player.load();
      player.play().catch(err => console.log("Playback interaction handled:", err));
    }

    function closeVideoPlayer() {
      const modal = document.getElementById('videoModal');
      const player = document.getElementById('main-player');
      player.pause();
      player.src = "";
      modal.classList.add('hidden');
    }
  </script>

</body>
</html>
