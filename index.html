<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PacificBox - Cinematic Stream Network</title>
  <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-950 text-gray-50 min-h-screen p-6 select-none" style="background-color: #0b0f19;">

  <header class="max-w-6xl mx-auto flex justify-between items-center border-b border-gray-900 pb-6 mb-8">
    <div class="flex items-center gap-3">
      <img src="PacificBox.png" alt="PacificBox Logo" class="w-12 h-12 object-contain">
      <div>
        <h1 class="font-bold text-xl tracking-wider text-white">PACIFICBOX</h1>
        <p class="text-xs text-gray-500 uppercase tracking-widest">Cinematic Stream Network</p>
      </div>
    </div>
  </header>
 
  <main class="max-w-6xl mx-auto flex flex-col gap-10">

    <section class="mb-10">
      <h2 class="text-xs font-bold text-yellow-600 uppercase tracking-widest mb-4">Historical Thriller</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
        
        <!-- Double B Card -->
        <div onclick="openVideoPlayer()" class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden cursor-pointer transform hover:scale-105 transition duration-300 shadow-xl group">
          <div class="w-full bg-black" style="aspect-ratio: 16/9;">
            <img src="doubleb-poster.png" alt="Double B Poster" class="w-full h-full object-cover">
          </div>
          <div class="p-4">
            <h3 class="font-bold text-sm text-gray-200 group-hover:text-yellow-500 transition">Double B</h3>
            <p class="text-xs text-gray-500 mt-1">Loyalty, Land & Freedom</p>
          </div>
        </div>

        <!-- Project Orion Placeholder -->
        <div class="bg-gray-900/50 border border-gray-800 rounded-xl flex items-center justify-center p-8 border-dashed" style="aspect-ratio: 16/11;">
          <span class="text-xs font-bold text-gray-700 tracking-widest uppercase">Project Orion</span>
        </div>

      </div>
    </section>

    <section>
      <h2 class="text-xs font-bold text-yellow-600 uppercase tracking-widest mb-4">Legal Drama</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
        <div class="bg-gray-900/50 border border-gray-800 rounded-xl flex items-center justify-center p-8 border-dashed" style="aspect-ratio: 16/11;">
          <span class="text-xs font-bold text-gray-700 tracking-widest uppercase">Coming Soon</span>
        </div>
      </div>
    </section>

  </main>
